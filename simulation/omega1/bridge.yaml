# Optional ros_gz_bridge config. Do not run omega_sim/hybrid's fake motor or
# sensor publishers alongside this bridge: they would duplicate state/topics.
- ros_topic_name: /omega/sim/cmd_vel
  gz_topic_name: /omega/sim/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /omega/sim/odom
  gz_topic_name: /omega/sim/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /omega/camera/image_raw
  gz_topic_name: /omega/camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /omega/sim/ultrasonic_scan
  gz_topic_name: /omega/sim/ultrasonic_scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
